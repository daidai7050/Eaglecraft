listeners:
- query_port: 25577
  motd: 'Eaglercraft Proxy'
  tab_list: GLOBAL_PING
  query_enabled: false
  proxy_protocol: false
  forced_hosts: {}
  ping_passthrough: false
  prioritized_suite: ECDHE
  bind_local_address: true
  host: 0.0.0.0:10000
  max_players: 7
  tab_size: 60
  force_default_server: true
  priorities:
  - lobby

servers:
  lobby:
    motd: 'Aternos Server'
    address: 'daidai7050.aternos.me:21495'
    restricted: false

remote_ping_cache: -1
network_compression_threshold: 256
permissions:
  default:
  - bungeecord.command.server
  - bungeecord.command.list
  admin:
  - bungeecord.command.alert
  - bungeecord.command.end
  - bungeecord.command.ip
  - bungeecord.command.reload

log_pings: true
connection_throttle: 4000
connection_throttle_limit: 1000
prevent_proxy_connections: false
timeout: 30000
player_limit: -1
ip_forward: false
online_mode: false
disabled_commands:
- disabledcommandhere
stats: 00000000-0000-0000-0000-000000000000
